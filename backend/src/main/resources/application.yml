spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/api_testing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:api_user}
    password: ${DB_PASSWORD:change-me-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
